<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rascal">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#040408;--card:#0f1117;--card2:#181b24;--bd:rgba(255,255,255,.08);
  --tx:#f0f0f0;--mu:rgba(255,255,255,.45);--mu2:rgba(255,255,255,.25);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --nav-h:144px;
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + var(--sb) + 16px)}
.page{padding:calc(var(--st) + 110px) 16px 24px;max-width:100%;overflow-x:hidden}
/* Nav */
.nav{
  flex-shrink:0;
  display:flex;flex-wrap:wrap;align-items:stretch;
  background:rgba(4,4,8,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--bd);
  padding-bottom:var(--sb);
  width:100%;max-width:100%;
  box-sizing:border-box;
}
.nav::-webkit-scrollbar{display:none}
.nb{
  flex:0 0 20%;width:20%;
  background:none;border:none;color:var(--mu);
  font-size:9px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;
  font-family:'DM Sans',sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;padding:6px 4px;position:relative;min-height:72px;
  transition:color .15s;
}
.nb.on{color:#22c55e}
.nb .ni{font-size:22px;line-height:1}
/* Badge */
.bdg{
  position:absolute;top:6px;right:6px;
  background:#ef4444;color:#fff;font-size:8px;font-weight:700;
  border-radius:10px;min-width:15px;height:15px;
  padding:0 3px;display:flex;align-items:center;justify-content:center;
}
/* Cards */
.card{background:var(--card);border-radius:14px;border:1px solid var(--bd);padding:14px 16px;margin-bottom:10px}
/* Inputs */
.finp{
  width:100%;background:var(--card2);border:1px solid var(--bd);border-radius:10px;
  color:var(--tx);font-size:15px;font-family:'DM Sans',sans-serif;
  padding:11px 12px;margin-bottom:12px;
}
.finp:focus{outline:none;border-color:rgba(34,197,94,.5)}
/* Pills */
.pill{
  background:var(--card2);border:1.5px solid var(--bd);border-radius:20px;
  color:var(--mu);font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;
  padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;margin:3px;
}
.pill.on{font-weight:600}
.pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
/* Buttons */
.bpri{
  background:#22c55e;border:none;border-radius:10px;color:#000;
  font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;
  padding:11px 20px;cursor:pointer;
}
.bdel{
  background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:10px;
  color:#ef4444;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;
  padding:11px 20px;cursor:pointer;
}
.bgh{
  background:var(--card2);border:1px solid var(--bd);border-radius:10px;
  color:var(--mu);font-size:15px;font-weight:500;font-family:'DM Sans',sans-serif;
  padding:11px 20px;cursor:pointer;
}
/* Modal */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
  display:flex;align-items:flex-end;
  cursor:default;pointer-events:all;
}
.modal-bg .modal{
  pointer-events:all;
  position:relative;z-index:101;
}
.modal{
  background:var(--card);border-radius:20px 20px 0 0;
  padding:20px 16px calc(20px + var(--sb));width:100%;
  max-height:90vh;overflow-y:auto;
}
.mhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.mtitle{font-family:'Syne',sans-serif;font-size:20px;font-weight:800}
.mclose{background:var(--card2);border:none;border-radius:50%;color:var(--mu);
  width:30px;height:30px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.flabel{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--mu);margin-bottom:6px}
.brow{display:flex;gap:8px;margin-top:4px}
/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-bottom:12px;width:100%}
.cal-dh{font-size:10px;font-weight:600;color:var(--mu);text-align:center;padding:4px 0}
.cal-d{
  min-height:36px;border-radius:8px;display:flex;flex-direction:column;
  align-items:center;padding:4px 2px;cursor:pointer;position:relative;
}
.cal-d.today{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3)}
.cal-d.sel{background:rgba(34,197,94,.25)}
.cal-d .dn{font-size:13px;font-weight:500;margin-bottom:2px}
.cal-d .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
/* Event rows */
.ev-row{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--card);border-radius:12px;margin-bottom:7px;
  border:1px solid var(--bd);cursor:pointer;border-left-width:3px;
}
.ev-title{font-size:14px;font-weight:600;color:var(--tx)}
.ev-sub{font-size:11px;color:var(--mu);margin-top:2px}
/* Upcoming date badge */
.date-badge{
  background:var(--card2);border-radius:8px;padding:4px 8px;
  text-align:center;min-width:40px;flex-shrink:0;
}
.date-badge .day{font-size:16px;font-weight:800;font-family:'Syne',sans-serif;line-height:1}
.date-badge .mon{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}
/* Splash overlay */
.splash{
  position:fixed;inset:0;background:var(--bg);z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:24px;height:24px;border:2px solid var(--bd);border-top-color:#22c55e;
  border-radius:50%;animation:spin .8s linear infinite}
</style>

<body>
<div id="app">

<script>
// ── CONSTANTS ─────────────────────────────────────────────────────────────────
var FB = "https://rascal-4c10a-default-rtdb.europe-west1.firebasedatabase.app";
var MB = ["Jason","Kerry","Oliver","Louis","Hugo"];
var C  = {Jason:"#3b82f6",Kerry:"#ec4899",Oliver:"#22c55e",Louis:"#a855f7",Hugo:"#f59e0b",All:"#22c55e",Holiday:"#64748b"};
var MONTHS_S = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MONTHS_L = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var DAYS_S   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// ── STATE ─────────────────────────────────────────────────────────────────────
var NOW = new Date();
var TD  = NOW.getFullYear()+"-"+p2(NOW.getMonth()+1)+"-"+p2(NOW.getDate());

var S = {
  tab:   "land",
  y:     NOW.getFullYear(),
  mo:    NOW.getMonth(),
  sel:   null,
  filter: null,
  showEdit: false,
  editId: null,
  edit: {},
  showAdd: false,
  nev: {title:"",date:"",member:[]},
  events: [],      // ← single source of truth, loaded from Firebase
  evLoaded: false,
};

function p2(n){return String(n).padStart(2,"0")}
function fmtDate(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function dateStr(s){
  var d=new Date(s+"T00:00:00");
  return MONTHS_S[d.getMonth()]+" "+d.getDate();
}
function set(patch){Object.assign(S,patch);render()}

// ── FIREBASE EVENTS ───────────────────────────────────────────────────────────

// ── LOCAL OVERRIDE STORE (guarantees edits persist even if Firebase fails) ──
function loadOverrides(){
  try{var s=localStorage.getItem("rascal_overrides");return s?JSON.parse(s):{};}catch(e){return {};}
}
function saveOverride(ev){
  try{var o=loadOverrides();o[ev.id]=ev;localStorage.setItem("rascal_overrides",JSON.stringify(o));}catch(e){}
}
function saveDeletion(id){
  try{var o=loadOverrides();o[id]={_deleted:true};localStorage.setItem("rascal_overrides",JSON.stringify(o));}catch(e){}
}
function applyOverrides(arr){
  var o=loadOverrides();
  // Apply edits/deletes to existing
  var out=arr.filter(function(e){return !(o[e.id]&&o[e.id]._deleted);})
    .map(function(e){return o[e.id]?o[e.id]:e;});
  // Add any override events not already in arr (newly added events)
  var ids=out.map(function(e){return e.id;});
  Object.keys(o).forEach(function(k){
    if(!o[k]._deleted&&ids.indexOf(k)===-1)out.push(o[k]);
  });
  return out;
}

function evLoad(){
  // MERGE STRATEGY: EMBEDDED is the base (always current from the app build).
  // Firebase events layer on top (cross-device additions/edits by family).
  // localStorage overrides win last (this device's own edits).
  function build(fbEvents){
    var byId={};
    // 1. Start with EMBEDDED
    EMBEDDED.forEach(function(e){byId[e.id]=Object.assign({},e);});
    // 2. Overlay Firebase events (newer cross-device data), but DON'T let a stale
    //    Firebase copy clobber an EMBEDDED event that has a newer 'rev' stamp.
    if(fbEvents){
      fbEvents.forEach(function(e){
        if(!e||!e.id||!e.date)return;
        var base=byId[e.id];
        // If embedded has a rev and firebase's is older/absent, keep embedded
        if(base&&base.rev&&(!e.rev||e.rev<base.rev))return;
        byId[e.id]=e;
      });
    }
    var arr=Object.keys(byId).map(function(k){return byId[k];});
    arr.forEach(function(e){if(!e.tod)e.tod="morning";});
    arr=applyOverrides(arr).sort(evSort);
    return arr;
  }
  fetch(FB+"/events.json?nocache="+Date.now(),{cache:"no-store"})
    .then(function(r){return r.json();})
    .then(function(d){
      var fb=d&&typeof d==="object"?Object.keys(d).map(function(k){return d[k];}):[];
      set({events:build(fb),evLoaded:true});
    })
    .catch(function(){
      set({events:build(null),evLoaded:true});
    });
}

function evSeed(){
  // Push EMBEDDED to Firebase then reload
  var puts=EMBEDDED.map(function(e){
    return fetch(FB+"/events/"+e.id+".json",{
      method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(e)
    });
  });
  Promise.all(puts).then(function(){evLoad();}).catch(function(){
    set({events:applyOverrides(EMBEDDED.slice()).sort(evSort),evLoaded:true});
  });
}

function toast(msg,ok){
  var t=document.createElement("div");
  t.textContent=msg;
  t.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--sb) + 90px);background:"+(ok?"#22c55e":"#ef4444")+";color:#000;font-size:13px;font-weight:700;padding:10px 18px;border-radius:20px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.4);font-family:DM Sans,sans-serif";
  document.body.appendChild(t);
  setTimeout(function(){t.remove();},3500);
}
function evWrite(ev){
  if(!ev||!ev.id){toast("\u2715 No event id!",false);return Promise.resolve();}
  return fetch(FB+"/events/"+ev.id+".json",{
    method:"PUT",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify(ev)
  }).then(function(r){
    if(r.ok)toast("\u2713 Saved",true);
    else toast("\u2715 Save failed",false);
    return r;
  }).catch(function(e){
    toast("\u2715 Failed: "+(e.message||e),false);
    console.error("evWrite",e);
  });
}

function evDelete(id){
  return fetch(FB+"/events/"+id+".json",{method:"DELETE"})
    .catch(function(e){console.error("evDelete",e);});
}

// ── EVENT HELPERS ─────────────────────────────────────────────────────────────
// Term dates for Holy Trinity (term-time recurrence). Each is [start,end] inclusive.
var TERM_DATES=[
  ["2026-04-20","2026-05-22"],["2026-06-01","2026-07-22"],
  ["2026-09-07","2026-10-23"],["2026-11-02","2026-12-18"],
  ["2027-01-04","2027-02-12"],["2027-02-22","2027-04-01"],
  ["2027-04-19","2027-05-28"],["2027-06-07","2027-07-21"]
];
function inTermTime(ds){
  return TERM_DATES.some(function(t){return ds>=t[0]&&ds<=t[1];});
}
function todShort(t){return{morning:"\ud83c\udf05 AM",afternoon:"\u2600\ufe0f PM",evening:"\ud83c\udf06 Eve",allday:"\ud83d\udcc5 All day"}[t]||"";}
function todOrder(t){return{morning:0,afternoon:1,evening:2,allday:3}[t||"morning"];}
function evSort(a,b){var d=a.date.localeCompare(b.date);return d!==0?d:todOrder(a.tod)-todOrder(b.tod);}
function allEvs(){
  var out=[];
  // Window for expanding recurring events: 6 months back, 18 months forward
  var winStart=new Date();winStart.setMonth(winStart.getMonth()-6);
  var winEnd=new Date();winEnd.setMonth(winEnd.getMonth()+18);
  S.events.forEach(function(e){
    if(e.recur==="daily"){
      var ds0=new Date(e.date+"T00:00:00");
      var c0=new Date(ds0);
      if(c0<winStart)c0=new Date(winStart);
      while(c0<=winEnd){
        var dsd=fmtDate(c0);
        if(dsd>=e.date&&(!e.termOnly||inTermTime(dsd))){
          out.push(Object.assign({},e,{date:dsd,_recur:true}));
        }
        c0.setDate(c0.getDate()+1);
      }
    } else if(e.recur==="weekly"){
      // Weekly recurrence on the same weekday as e.date
      var start=new Date(e.date+"T00:00:00");
      var cur=new Date(start);
      // Don't go before the event's own start date
      if(cur<winStart)cur=new Date(winStart);
      // Align to the correct weekday
      var targetDow=start.getDay();
      while(cur.getDay()!==targetDow)cur.setDate(cur.getDate()+1);
      while(cur<=winEnd){
        var ds=fmtDate(cur);
        if(ds>=e.date&&(!e.termOnly||inTermTime(ds))){
          out.push(Object.assign({},e,{date:ds,_recur:true}));
        }
        cur.setDate(cur.getDate()+7);
      }
    } else if(e.endDate&&e.endDate>e.date){
      var c2=new Date(e.date+"T00:00:00"),end=new Date(e.endDate+"T00:00:00");
      while(c2<=end){
        out.push(Object.assign({},e,{date:fmtDate(c2),_span:true}));
        c2.setDate(c2.getDate()+1);
      }
    } else {
      out.push(e);
    }
  });
  return out;
}

function getMembers(e){
  if(!e.member||e.member==="All"||e.member==="Holiday")return["All"];
  return Array.isArray(e.member)?e.member:[e.member];
}

function primColor(e){
  var ms=getMembers(e);
  var f=ms.find(function(m){return C[m]&&m!=="All";});
  return C[f||ms[0]]||"#22c55e";
}

function todLabel(t){
  return {morning:"🌅 Morning",afternoon:"☀️ Afternoon",evening:"🌆 Evening"}[t]||"";
}
function memberLabel(m){
  if(!m||m==="All"||m==="Holiday"||m==="Everyone")return"Everyone";
  if(Array.isArray(m))return m.join(" & ");
  return m;
}

function matchFilter(e){
  if(!S.filter)return true;
  var ms=getMembers(e);
  return ms.indexOf(S.filter)>-1||ms.indexOf("All")>-1;
}

// Count events today+tomorrow for badge
function badge24(){
  var tom=new Date(NOW);tom.setDate(NOW.getDate()+7);
  var ts=fmtDate(tom);
  return allEvs().filter(function(e){return e.date>=TD&&e.date<=ts;}).length;
}

// ── RENDER ────────────────────────────────────────────────────────────────────

function pageSchool(){
  function term(name,start,end,color){
    var sd=new Date(start+"T00:00:00"),ed=new Date(end+"T00:00:00");
    var days=Math.round((ed-sd)/(1000*60*60*24))+1;
    var now=new Date();now.setHours(0,0,0,0);
    var active=now>=sd&&now<=ed;
    var past=now>ed;
    if(past)return"";
    return'<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--bd)">'
      +'<div style="width:10px;height:10px;border-radius:50%;background:'+color+';flex-shrink:0;opacity:'+(past?'0.35':'1')+'"></div>'
      +'<div style="flex:1">'
      +'<div style="font-size:14px;font-weight:600;color:'+(past?'var(--mu)':' var(--tx)')+'">'+name+(active?' <span style="font-size:10px;color:#22c55e;font-weight:700;letter-spacing:1px">NOW</span>':'')+'</div>'
      +'<div style="font-size:11px;color:var(--mu);margin-top:2px">'+dateStr(start)+' &ndash; '+dateStr(end)+' &middot; '+days+' days</div>'
      +'</div></div>';
  }

  function hol(name,start,end){
    var now=new Date();now.setHours(0,0,0,0);
    var sd=new Date(start+"T00:00:00"),ed=new Date(end+"T00:00:00");
    var active=now>=sd&&now<=ed;
    var past=now>ed;
    if(past)return"";
    return'<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--bd)">'
      +'<div style="font-size:16px">🏖️</div>'
      +'<div style="flex:1">'
      +'<div style="font-size:14px;font-weight:500;color:'+(past?'var(--mu2)':' var(--tx)')+'">'+name+(active?' <span style="font-size:10px;color:#f59e0b;font-weight:700">NOW</span>':'')+'</div>'
      +'<div style="font-size:11px;color:var(--mu);margin-top:2px">'+dateStr(start)+' &ndash; '+dateStr(end)+'</div>'
      +'</div></div>';
  }

  return'<div class="page">'
    +'<div style="font-family:Syne,sans-serif;font-size:24px;font-weight:800;margin-bottom:2px">School Terms</div>'
    +'<div style="font-size:12px;color:var(--mu);margin-bottom:20px">Holy Trinity C of E Primary, Cookham</div>'

    +'<div style="font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-bottom:6px">2025–2026</div>'
    +'<div style="background:var(--card);border-radius:14px;border:1px solid var(--bd);overflow:hidden;margin-bottom:16px">'
    +term("Autumn 1","2025-09-04","2025-10-24","#f59e0b")
    +hol("Half Term","2025-10-27","2025-10-31")
    +term("Autumn 2","2025-11-03","2025-12-19","#f59e0b")
    +hol("Christmas","2025-12-22","2026-01-02")
    +term("Spring 1","2026-01-05","2026-02-13","#3b82f6")
    +hol("Half Term","2026-02-16","2026-02-20")
    +term("Spring 2","2026-02-23","2026-04-01","#3b82f6")
    +hol("Easter","2026-04-02","2026-04-17")
    +term("Summer 1","2026-04-20","2026-05-22","#22c55e")
    +hol("Half Term","2026-05-25","2026-05-29")
    +term("Summer 2","2026-06-01","2026-07-22","#22c55e")
    +'</div>'

    +'<div style="font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-bottom:8px">2026–2027</div>'
    +'<div style="background:var(--card);border-radius:14px;border:1px solid var(--bd);overflow:hidden;margin-bottom:16px">'
    +term("Autumn 1","2026-09-07","2026-10-23","#f59e0b")
    +hol("Half Term","2026-10-26","2026-10-30")
    +term("Autumn 2","2026-11-02","2026-12-18","#f59e0b")
    +hol("Christmas","2026-12-21","2027-01-01")
    +term("Spring 1","2027-01-04","2027-02-12","#3b82f6")
    +hol("Half Term","2027-02-15","2027-02-19")
    +term("Spring 2","2027-02-22","2027-04-01","#3b82f6")
    +'</div>'

    +'<div style="font-size:10px;color:var(--mu2);text-align:center">Dates based on Royal Borough of Windsor &amp; Maidenhead</div>'
    +'</div>';
}


// ── WEATHER ───────────────────────────────────────────────────────────────────
var _wx = null, _wxLoading = false, _wxErr = null;

var _WX_CODES = {
  0:"Clear",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",
  45:"Foggy",48:"Icy fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",
  61:"Light rain",63:"Rain",65:"Heavy rain",71:"Light snow",73:"Snow",75:"Heavy snow",
  80:"Rain showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Heavy snow showers",
  95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm"
};
var _WX_ICONS = {
  0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",
  51:"🌦️",53:"🌦️",55:"🌧️",61:"🌦️",63:"🌧️",65:"🌧️",
  71:"🌨️",73:"❄️",75:"❄️",80:"🌦️",81:"🌧️",82:"⛈️",
  95:"⛈️",96:"⛈️",99:"⛈️"
};

function _wxLoad(){
  if(_wxLoading)return;
  _wxLoading=true;
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude.toFixed(4);
    var lon=pos.coords.longitude.toFixed(4);
    var url="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon
      +"&current=temperature_2m,weathercode,windspeed_10m,relativehumidity_2m"
      +"&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_sum"
      +"&timezone=Europe%2FLondon&forecast_days=4";
    fetch(url).then(function(r){return r.json();}).then(function(d){
      _wx=d;_wxLoading=false;
      if(S.tab==="weather")render();
    }).catch(function(){_wxLoading=false;_wxErr="Failed to load";if(S.tab==="weather")render();});
  },function(err){
    _wxLoading=false;
    _wxErr=err.code===1?"Location denied":"Location unavailable";
    if(S.tab==="weather")render();
  },{timeout:8000});
}

function _wxWidget(){
  if(!navigator.geolocation) return "";
  if(!_wx&&!_wxLoading&&!_wxErr){
    setTimeout(_wxLoad,100);
    return'<div class="card" style="text-align:center;padding:16px"><div class="spinner"></div></div>';
  }
  if(_wxLoading) return'<div class="card" style="text-align:center;padding:16px"><div class="spinner" style="margin:0 auto"></div></div>';
  if(_wxErr) return'<div class="card" style="font-size:13px;color:var(--mu);text-align:center">'+_wxErr+'</div>';
  var c=_wx.current,d=_wx.daily;
  var icon=_WX_ICONS[c.weathercode]||"🌡️";
  var desc=_WX_CODES[c.weathercode]||"";
  var days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var forecast=d.time.slice(1,4).map(function(date,i){
    var dt=new Date(date+"T00:00:00");
    var ic=_WX_ICONS[d.weathercode[i+1]]||"🌡️";
    return'<div style="text-align:center;flex:1">'
      +'<div style="font-size:10px;color:var(--mu);margin-bottom:4px">'+days[dt.getDay()]+'</div>'
      +'<div style="font-size:18px">'+ic+'</div>'
      +'<div style="font-size:11px;font-weight:600;margin-top:2px">'+Math.round(d.temperature_2m_max[i+1])+"°</div>"
      +'<div style="font-size:10px;color:var(--mu)">'+Math.round(d.temperature_2m_min[i+1])+"°</div>"
      +'</div>';
  }).join("");
  return'<div class="card" style="padding:10px 14px">'
    +'<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">'
    +'<div style="font-size:32px;line-height:1">'+icon+'</div>'
    +'<div>'
    +'<div style="font-family:Syne,sans-serif;font-size:26px;font-weight:800;line-height:1">'+Math.round(c.temperature_2m)+'°<span style="font-size:14px;color:var(--mu)">C</span></div>'
    +'<div style="font-size:12px;color:var(--mu);margin-top:2px">'+desc+' &middot; '+Math.round(c.windspeed_10m)+' km/h</div>'
    +'</div></div>'
    +'<div style="display:flex;gap:4px;border-top:1px solid var(--bd);padding-top:12px">'+forecast+'</div>'
    +'</div>';
}


function pageWeather(){
  // Load on first open or if stale (>30 min)
  if(!_wx&&!_wxLoading&&!_wxErr){_wxLoad();}
  if(_wxLoading) return'<div class="page" style="display:flex;align-items:center;justify-content:center;min-height:60vh"><div class="spinner"></div></div>';
  if(_wxErr) return'<div class="page"><div style="font-family:Syne,sans-serif;font-size:24px;font-weight:800;margin-bottom:16px">Weather</div><div class="card" style="text-align:center;padding:24px;color:var(--mu)">'+_wxErr+'<br><br><button onclick="_wx=null;_wxErr=null;_wxLoading=false;_wxLoad()" style="background:var(--card2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);padding:8px 16px;cursor:pointer;font-family:inherit;margin-top:8px">Try again</button></div></div>';
  if(!_wx) return'<div class="page"><div style="font-family:Syne,sans-serif;font-size:24px;font-weight:800;margin-bottom:16px">Weather</div><div class="card" style="text-align:center;padding:24px;color:var(--mu)">Loading...</div></div>';

  var c=_wx.current,d=_wx.daily;
  var icon=_WX_ICONS[c.weathercode]||"🌡️";
  var desc=_WX_CODES[c.weathercode]||"";
  var days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var MONTHS_SH=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  // 7-day forecast
  var forecast=d.time.map(function(date,i){
    var dt=new Date(date+"T00:00:00");
    var ic=_WX_ICONS[d.weathercode[i]]||"🌡️";
    var desc2=_WX_CODES[d.weathercode[i]]||"";
    var isToday=i===0;
    var rain=d.precipitation_sum[i]>0?'<div style="font-size:10px;color:#60a5fa;margin-top:2px">💧'+d.precipitation_sum[i].toFixed(1)+"mm</div>":"";
    return'<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--bd)">'
      +'<div style="min-width:44px"><div style="font-size:12px;font-weight:600;color:'+(isToday?'#22c55e':'var(--tx)')+'">'+( isToday?"Today":days[dt.getDay()])+'</div><div style="font-size:10px;color:var(--mu)">'+dt.getDate()+' '+MONTHS_SH[dt.getMonth()]+'</div></div>'
      +'<div style="font-size:24px;flex-shrink:0">'+ic+'</div>'
      +'<div style="flex:1"><div style="font-size:13px;color:var(--tx)">'+desc2+'</div>'+rain+'</div>'
      +'<div style="text-align:right"><div style="font-size:15px;font-weight:700">'+Math.round(d.temperature_2m_max[i])+"°</div>"
      +'<div style="font-size:11px;color:var(--mu)">'+Math.round(d.temperature_2m_min[i])+"°</div>"
      +'</div></div>';
  }).join("");

  return'<div class="page">'
    +'<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px">'
    +'<div style="font-family:Syne,sans-serif;font-size:24px;font-weight:800">Weather</div>'
    +'<button onclick="_wx=null;_wxErr=null;_wxLoading=false;_wxLoad()" style="background:none;border:none;font-size:12px;color:var(--mu);cursor:pointer;font-family:inherit">Refresh</button>'
    +'</div>'
    +'<div class="card" style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:16px">'
    +'<div style="font-size:56px;line-height:1">'+icon+'</div>'
    +'<div><div style="font-family:Syne,sans-serif;font-size:48px;font-weight:800;line-height:1">'+Math.round(c.temperature_2m)+'°</div>'
    +'<div style="font-size:14px;color:var(--mu);margin-top:4px">'+desc+'</div>'
    +'<div style="font-size:12px;color:var(--mu2);margin-top:2px">💨 '+Math.round(c.windspeed_10m)+' km/h &middot; 💧 '+c.relativehumidity_2m+'%</div>'
    +'</div></div>'
    +'<div style="background:var(--card);border-radius:14px;border:1px solid var(--bd);overflow:hidden">'+forecast+'</div>'
    +'</div>';
}


function pageTrains(){
  var now=new Date();
  var hr=now.getHours();
  var isMorning=hr<12;
  var today=fmtDate(now);

  // National Rail deep links
  var cmkToPad="https://www.thetrainline.com/book/results?origin=CMK&destination=PAD&outwardDate="+today+"T"+(hr<10?"0":"")+hr+":00:00&outwardDateType=departAfter&adults=1";
  var padToCmk="https://www.thetrainline.com/book/results?origin=PAD&destination=CMK&outwardDate="+today+"T"+(hr<10?"0":"")+hr+":00:00&outwardDateType=departAfter&adults=1";

  function routeCard(from,to,label,emoji,link,active){
    return'<div class="card" style="border-color:'+(active?"rgba(34,197,94,.4)":"var(--bd)")+';margin-bottom:12px">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'
      +'<div>'
      +'<div style="font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:'+(active?"#22c55e":"var(--mu)")+';margin-bottom:4px">'+label+'</div>'
      +'<div style="font-family:Syne,sans-serif;font-size:22px;font-weight:800">'+from+' → '+to+'</div>'
      +'</div>'
      +'<div style="font-size:32px">'+emoji+'</div>'
      +'</div>'
      +'<a href="'+link+'" target="_blank" style="display:block;width:100%;background:'+(active?"#22c55e":"var(--card2)")+';border:1px solid '+(active?"#22c55e":"var(--bd)")+';border-radius:10px;color:'+(active?"#000":"var(--tx)")+';text-align:center;font-size:15px;font-weight:700;font-family:inherit;padding:12px;text-decoration:none;box-sizing:border-box">'
      +'🚂 View live departures</a>'
      +'</div>';
  }

  return'<div class="page">'
    +'<div style="font-family:Syne,sans-serif;font-size:24px;font-weight:800;margin-bottom:4px">Trains</div>'
    +'<div style="font-size:12px;color:var(--mu);margin-bottom:20px">Cookham ↔ London Paddington · GWR</div>'
    +routeCard("Cookham","Paddington","🌅 Morning","🏙️",cmkToPad,isMorning)
    +routeCard("Paddington","Cookham","🌆 Evening","🏡",padToCmk,!isMorning)
    +'<div class="card" style="margin-top:4px">'
    +'<div style="font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-bottom:12px">Journey Info</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
    +[["🕐 Journey","~50 min"],["🚉 Via","Maidenhead"],["🚆 Operator","GWR"],["📍 Platform","Check board"]].map(function(r){
      return'<div style="background:var(--card2);border-radius:10px;padding:10px 12px">'
        +'<div style="font-size:11px;color:var(--mu);margin-bottom:3px">'+r[0]+'</div>'
        +'<div style="font-size:14px;font-weight:600">'+r[1]+'</div>'
        +'</div>';
    }).join("")
    +'</div></div>'
    +'</div>';
}

function render(){
  var body=document.getElementById("body");
  var nav=document.getElementById("nav");
  if(!body||!nav)return;

  body.innerHTML=page();
  nav.innerHTML=navHTML();

  // Modals are created by their handlers, not render. Just clean up if closed.
  if(!S.showEdit&&!S.showAdd){var m=document.querySelector(".modal-bg");if(m)m.remove();}
}

function page(){
  if(!S.evLoaded)return'<div class="page" style="display:flex;align-items:center;justify-content:center;min-height:60vh"><div class="spinner"></div></div>';
  switch(S.tab){
    case"land":     return pageLand();
    case"home":     return pageHome();
    case"calendar": return pageCal();
    case"shop":     return pageShop();
    case"watch":    return pageWatch();
    case"info":     return pageInfo();
    case"run":      return pageRun();
    case"school":   return pageSchool();
    case"todo":     return pageTodo();
    case"hugo":     return pageHugo();
    case"weather":  return pageWeather();
    default:        return pageHome();
  }
}

function navHTML(){
  var t=S.tab;
  var b=badge24();
  var bdg=b?'<span class="bdg">'+b+'</span>':"";
  function nb(tab,emoji,label,extra){
    return'<button class="nb'+(t===tab?" on":"")+'" data-a="tab" data-tab="'+tab+'">'+
      (extra||"")+'<span class="ni">'+emoji+'</span>'+label+'</button>';
  }
  return nb("land","🌿","Rascal")
    +'<button class="nb'+(t==="home"?" on":"")+'" data-a="tab" data-tab="home">'+bdg+'<span class="ni">🏠</span>Home</button>'
    +nb("calendar","📅","Cal")
    +nb("shop","🛒","Shop")
    +nb("watch","🎬","Watch")
    +nb("info","📋","Info")
    +nb("run","🏃","Run")
    +nb("weather","🌤️","Weather")
    +nb("school","🏫","School")
    +nb("todo","✅","To-do")
    +nb("hugo","🐾","Hugo")
    +'<button class="nb" onclick="doUpdate()"><span class="ni">↻</span>Update</button>';
}

// ── UPDATE ────────────────────────────────────────────────────────────────────
function doUpdate(){
  try{sessionStorage.setItem("r_tab",S.tab);sessionStorage.setItem("r_y",S.y);sessionStorage.setItem("r_mo",S.mo);}catch(e){}
  // Show splash
  var sp=document.createElement("div");sp.className="splash";
  sp.innerHTML='<div style="font-family:Syne,sans-serif;font-size:32px;font-weight:800;letter-spacing:-2px;color:#fff">rascal</div>'
    +'<div class="spinner"></div>'
    +'<div style="font-size:11px;color:#22c55e;letter-spacing:3px;text-transform:uppercase">Updating...</div>';
  document.body.appendChild(sp);
  setTimeout(function(){
    var base=location.href.split("?")[0];
    location.replace(base+"?v="+Date.now());
  },400);
}

// Restore state after update
(function(){
  try{
    if(location.search&&!location.search.includes('code='))history.replaceState({},"",location.pathname);
    var t=sessionStorage.getItem("r_tab");
    if(t){S.tab=t;sessionStorage.removeItem("r_tab");}
    var y=sessionStorage.getItem("r_y"),mo=sessionStorage.getItem("r_mo");
    if(y&&mo){S.y=parseInt(y);S.mo=parseInt(mo);sessionStorage.removeItem("r_y");sessionStorage.removeItem("r_mo");}
  }catch(e){}
})();
</script>

          +'<div style="flex:1"><div class="ev-title">'+e.title+'</div>'

          +'<span style="color:var(--mu);font-size:18px">›</span></div>';
      });
      selHTML+='</div>';
    }
  }

  // Upcoming events list — shows when no specific day selected (e.g. after picking a member filter)
  var upHTML='';
  if(!S.sel){
    var nowD2=new Date();
    var viewingCur=(S.y===nowD2.getFullYear()&&S.mo===nowD2.getMonth());
    var monthPfx=S.y+"-"+p2(S.mo+1);
    var upcoming;
    if(viewingCur){
      upcoming=all.filter(function(e){return e.date>=TD&&matchFilter(e);}).sort(evSort).slice(0,15);
    } else {
      upcoming=all.filter(function(e){return e.date.indexOf(monthPfx)===0&&matchFilter(e);}).sort(evSort);
    }
    if(upcoming.length){
      var lbl=viewingCur?"Upcoming":(MONTHS_S[S.mo]+" "+S.y);
      upHTML='<div style="margin-top:16px">';
      upHTML+='<div style="font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-bottom:10px">'+lbl+'</div>';
      upcoming.forEach(function(e){
        var col=primColor(e);
        var d=new Date(e.date+"T00:00:00");
        var ds=DAYS_S[d.getDay()]+" "+d.getDate()+" "+MONTHS_S[d.getMonth()];
        upHTML+='<div class="ev-row" style="border-left-color:'+col+'" data-a="open-edit" data-id="'+e.id+'">'
          +'<div style="flex:1"><div class="ev-title">'+e.title+'</div>'
          +'<div class="ev-sub">'+ds+' &middot; '+memberLabel(e.member)+(e.tod&&todShort(e.tod)?' &middot; '+todShort(e.tod):'')+'</div></div>'
          +'<span style="color:var(--mu);font-size:18px">›</span></div>';
      });
      upHTML+='</div>';
    } else {
      upHTML='<div style="margin-top:24px;text-align:center;color:var(--mu);font-size:13px;padding:20px">No upcoming events</div>';
    }
  }

  return'<div class="page" style="padding-top:calc(var(--st) + 20px);overflow-x:hidden">'
    +'<div style="position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(var(--st) + 60px) 0 12px;margin-bottom:4px;overflow:visible">'
    +header
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;padding-bottom:8px">'+pills.join("")+'</div>'
    +'</div>'
    +dayHeaders+grid+selHTML+upHTML
    +'<button data-a="show-add" style="position:fixed;bottom:calc(var(--nav-h) + var(--sb) + 70px);right:18px;width:60px;height:60px;border-radius:30px;background:#22c55e;border:none;color:#000;font-size:32px;box-shadow:0 4px 16px rgba(34,197,94,.5);z-index:90;cursor:pointer;box-shadow:0 4px 16px rgba(34,197,94,.4)">+</button>'
    +'</div>';
}

var HUGO_TASKS=[["Foundations", "Name response", "Quiet room, no distractions. Say 'Hugo' once in a bright voice. The instant his head turns, say 'yes!' and feed a treat right to his mouth. Do 5–10 reps a session. Never repeat his name over and over — say it once and make turning to you worth it. Goal: his name reliably means 'good things, look at me'."], ["Foundations", "Voluntary check-ins", "Stand or sit doing nothing. The moment Hugo looks up at your face on his own, mark 'yes' and treat. You're rewarding his choice to check in with you, which becomes the backbone of off-lead reliability later. Practise on walks too — reward every unprompted glance."], ["Foundations", "Hand-target ('touch')", "Hold a flat palm an inch from his nose. Curiosity makes him sniff/boop it — say 'yes' and treat the instant his nose touches. Add the word 'touch' once he's reliable. Use it to move him around, past scary things, or to reposition without ever pulling the lead."], ["Foundations", "Settle on mat — 30 seconds", "Put a towel/mat down, lure him into a down on it, feed a few treats for staying down, release with 'OK'. Build to 30 seconds of calm. The mat becomes a portable 'this is where you relax' signal you'll use in cafes and at home."], ["Foundations", "Settle on mat — 5 minutes", "Same mat, now during something boring like TV. Drop a treat between his paws every time he stays settled, gradually spacing them out. If he gets up, calmly guide him back. Build to 5 relaxed minutes. Calmness is a skill — you're teaching it like any other."], ["Foundations", "Calm in open crate", "Door open, toss a treat in, let him go in and out freely. Feed him in there; drop occasional treats when he chooses to rest inside. Never shut him in as punishment. The crate should become his safe den he likes, so it helps with alone-time and travel later."], ["Foundations", "Capturing calm", "Throughout the day, quietly drop a treat beside Hugo whenever he settles down on his own — no cue, no fuss. You're 'capturing' the calm behaviour so it happens more. Especially powerful in the evening to build an off-switch in an excitable pup."], ["Foundations", "Eye contact / 'watch me'", "Hold a treat at your eye, say 'watch'. When he holds eye contact for 1–2 seconds, mark and treat. Build to 3+ seconds, then start asking for it with mild distractions about. This becomes your 'focus on me, ignore that' button out in the world."], ["Foundations", "Collar & harness handling", "Touch his collar, give a treat. Hold it gently, treat. Slip the harness on, treat, take it off, treat. Keep sessions tiny and positive so equipment predicts good things — no more wrestling to get the harness on before walks."], ["Foundations", "Body handling", "A few seconds each: handle paws, look in ears, lift a lip, touch his tail — treating throughout. Keep him relaxed, stop before he wriggles. This makes vet exams, nail trims and grooming calm rather than a fight. Do a little most days."], ["Foundations", "Gentle food taking", "Offer a treat on a flat open palm. If he lunges or nips, close your hand into a fist — no treat. Open again when his mouth softens. He learns a gentle mouth gets the food. Important with kids around. Say 'gentle' as the cue."], ["Foundations", "Four-on-the-floor greeting", "Have a familiar person approach. Attention and fuss only while all four paws are on the floor. The second he jumps, the person turns away and steps back — no telling off, just no reward. Reward calm greetings. Consistency from everyone is key."], ["Foundations", "Relaxed lead in garden", "Clip the lead on in the calm of the garden. Reward any moment the lead is slack and he's near you. No destination, no pulling pressure — just teaching that being beside you on a loose lead pays. The foundation for all street walking."], ["Foundations", "Follows you off-lead", "Indoors/garden, simply wander about. Every time Hugo chooses to follow and stay with you, mark and treat. Change direction, be interesting. You're building the instinct to stick with you, which underpins recall and off-lead freedom later."], ["Foundations", "Easy 'leave it'", "Put a boring treat under your hand on the floor. He'll sniff and paw — wait. The instant he backs off or looks away, say 'yes' and treat from the OTHER hand (never the covered one). Builds the first brick of impulse control. Add the cue 'leave' as he gets it."], ["Obedience", "Sit (word only)", "Once he sits for a food lure, start saying 'sit' and giving just a small hand signal (palm up) with no food in hand. Reward from a pouch after he sits. You're moving from bribery to a real cue. Practise in different rooms so it generalises."], ["Obedience", "Down (word only)", "Lure him from sit to lying down, then fade the lure to a pointing-down hand signal plus the word 'down'. Reward calmly on the floor between his paws to encourage staying down. Keep it relaxed, not a snap-drill."], ["Obedience", "Stand on cue", "From a sit, hold a treat at nose height and draw it forward so he stands up onto all fours; say 'stand'. Reward. Useful for drying muddy paws after Chiltern walks and for vet checks."], ["Obedience", "Sit-stay — 30s, 1 step", "Sit, say 'stay' with a flat-palm signal, take ONE step back, step in and reward before he moves. Build duration and distance separately, never both at once. If he breaks, you went too fast — make it easier. Always return TO him to reward, don't call him out of it."], ["Obedience", "Down-stay — 2 min, across room", "A down holds longer than a sit. Build distance gradually until you can walk across the room and back. Work up to 2 minutes. Drop occasional treats for staying. This is the building block of the cafe settle and managing him around visitors."], ["Obedience", "Recall — 5m in garden", "Long line on for safety. In an excited voice, 'Hugo, COME!', and reward LAVISHLY when he arrives — a jackpot of several treats and praise. Coming back must always be the best decision he ever made. Never call him to do something he dislikes."], ["Obedience", "Recall off a mild distraction", "Place a toy on the floor a few metres away. Let him notice it, then call him to you and reward with something better than the toy. Teaches that coming back beats the distraction — the start of real-world recall."], ["Obedience", "Loose lead — 10 steps", "Walk forward. The moment the lead tightens, stop dead like a tree. Wait for him to ease off / look back, then walk on — movement is the reward. Reward heavily for 10 steps with a slack lead. Slow but it genuinely works; pulling never pays."], ["Obedience", "Loose lead past objects", "Now add mild real-world distractions — walk loose-lead past parked cars, bins, lampposts. Reward him for choosing to stay with you rather than veering off to sniff everything. Build up before tackling busy pavements."], ["Obedience", "Kerb sit", "As you reach a kerb, stop and cue a sit; reward. Repeat at every kerb until he sits automatically without being asked. Builds road safety into the routine and gives a calm pause before crossing."], ["Obedience", "'Wait' at doorways", "At an open door, body-block if needed and say 'wait'. Step through; only release him with 'OK' to follow. Stops the dangerous habit of barging out of doors. Practise at the front door, back door and garden gate."], ["Obedience", "'Wait' at the car", "Open the boot/door but he must hold a 'wait' until you say 'OK'. Prevents him leaping out into a road or car park before you're ready. A genuine safety essential — never skip it."], ["Obedience", "'Place' / 'on your bed'", "Send him to a defined bed or mat from a couple of metres with 'place'. Reward settling there. Brilliant for mealtimes, deliveries and managing him when guests arrive. Build distance and duration over time."], ["Obedience", "Leave high-value food", "Step up from easy 'leave it': place a really tasty treat on the floor, cover with hand or foot if needed, say 'leave'. Reward from your hand, never the floor treat. Big impulse-control milestone — leads to ignoring dropped food on walks."], ["Obedience", "Drop / 'give'", "Offer a swap: show a treat, say 'drop', and the instant he releases the toy, treat and (often) give the toy back. He learns letting go gets a reward AND the toy returns, so he's happy to give things up — vital if he grabs something dangerous."], ["Obedience", "Cafe settle — 10 min", "At home first, build a long down-settle on his mat to 10 minutes with a chew, mimicking a cafe. Reward calm. Then take it to a quiet cafe before a busy one. This is what makes him welcome at pubs and friends' houses."], ["Obedience", "Heel turns", "In heel position (head by your leg), practise left turns, right turns and about-turns, rewarding him for staying glued to your side through the turn. Builds precise, attentive walking for busy or narrow spaces."], ["Obedience", "Emergency stop / 'down' at distance", "While he's moving away from you, cue a sharp 'down' (or 'stop') and reward instantly when he drops. Practise on the long line. If he ever heads toward a road, this can stop him in his tracks — a true life-saver, so proof it well."], ["Obedience", "Middle position", "Teach him to come and sit between your legs facing forward, on a cue like 'middle'. Lure through your legs at first. Gives him a secure 'anchor' spot when you're in a crowd, near scary dogs, or need both hands free."], ["Obedience", "Clear release word", "Always end every stay/wait with one clear release word — 'OK' or 'free' — before he moves. He learns to hold position until released, not until he feels like it. The release word makes stays genuinely reliable."], ["People", "Stranger walking past", "At whatever distance keeps him relaxed, reward Hugo for noticing a passing stranger and staying calm. Don't force a greeting. If he's tense, add distance. You're teaching that strangers are background scenery, not a big event."], ["People", "Hats & hoods", "People in hats, hoods and big coats look odd to a dog. Expose him at a comfortable distance and treat for calm watching. Build closer over sessions. Prevents the classic 'barks at people in hoods' problem."], ["People", "Beards & sunglasses", "Faces that hide features (beards, sunglasses, helmets) can unsettle dogs. Let him observe and reward calm. If you have friends who fit the bill, ask them to toss him a treat. Builds trust in all kinds of faces."], ["People", "Sticks & crutches", "Walking sticks, crutches and walking frames move strangely and can alarm dogs. Watch from a distance he's happy with, reward calm, decrease distance slowly. Important so he's never reactive toward elderly or disabled people."], ["People", "Wheelchairs & mobility scooters", "Wheeled mobility aids combine movement + odd shape + sometimes noise. Expose gradually at a safe distance, rewarding calm. A key socialisation item — you want him completely unbothered by them."], ["People", "Noisy children", "Children run, squeal and move unpredictably. From a safe distance (e.g. a park edge or playground railing) let him watch and reward calm. Never let kids mob him. Build closer only as he stays relaxed. Crucial with Louis's friends about."], ["People", "Toddlers & pushchairs", "Toddlers wobble and a pushchair is a strange moving object at his eye level. Calm, distanced exposure with treats. Builds the rock-solid tolerance you need around little ones and family with babies."], ["People", "Hi-vis & uniforms", "Posties, builders, delivery drivers and police in hi-vis/uniform are common triggers for barking. Reward calm whenever you spot one. Toss a treat as the postie passes the gate to flip 'intruder' into 'good thing'."], ["People", "People carrying things", "Someone carrying boxes, bags or an umbrella has a changed silhouette that can worry dogs. Expose and reward calm. Helps him stay relaxed around shoppers, deliveries and busy high streets."], ["People", "Stranger stroke", "Ask a calm, dog-savvy stranger to let Hugo approach THEM (not loom over him), offer a hand, give a brief chest/chin stroke, then stop. Reward Hugo. Keep it short and positive so he enjoys but isn't over-aroused by greetings."], ["People", "Jogger passing", "Fast movement triggers the chase instinct. Reward Hugo for sitting or staying calm as a jogger passes, building from a distance. Stops lunging/chasing — important on the Thames Path and around Cookham."], ["People", "Cyclist passing", "Like joggers but faster, with spinning wheels. Reward calm as bikes pass, gradually closing distance. Essential given how many cyclists are around the Chilterns lanes and riverside."], ["People", "Loud group of people", "A noisy group (pub garden, party) can overwhelm a pup. Observe from the edge, reward calm, move closer as he copes. Prepares him for busy social gatherings and the Early Bar crowd."], ["People", "Settle during a conversation", "Stop and chat with someone while Hugo holds a settle at your feet. Reward calm waiting. Real-world patience — he learns that when you're talking, his job is to relax, not to demand attention or pull to greet."], ["Animals", "Calm dog at distance", "Spot another calm dog far enough away that Hugo notices but stays relaxed — that distance is your starting line. Reward looking at the dog then back at you. Slowly decrease distance over many sessions. Distance is the key to all dog socialisation."], ["Animals", "Dog passing on lead", "As a steady dog passes on lead, keep Hugo moving and reward calm. Don't stop for a face-to-face on-lead greeting (lead tension causes tension). Teaches him most dogs are just passing scenery."], ["Animals", "Polite greeting, then disengage", "With a known friendly dog, allow a brief 3-second sniff, then cheerfully call Hugo away and reward. Short greetings stay calm; long ones tip into over-arousal or trouble. Teaches him to say hello AND come away nicely."], ["Animals", "Barking dog behind fence", "Walk past a dog barking behind a fence; reward Hugo for ignoring it and staying with you. Add distance if needed. Teaches him not to react to other dogs' noise — common on neighbourhood walks."], ["Animals", "Excitable puppy", "A bouncy, over-the-top puppy can wind Hugo up. Let him meet one while you keep things calm and reward him for not matching the mania. Builds the ability to stay level around hyper dogs."], ["Animals", "Large breed dog", "Meet or observe a big, calm dog so size alone doesn't intimidate or over-excite him. Keep it positive and brief. A well-socialised dog is comfortable with all shapes and sizes."], ["Animals", "Recall off play", "During play with a known dog, call Hugo out, reward, then release him straight back to play. Play itself becomes the reward for recall. Teaches that coming when called doesn't mean the fun ends — vital for off-lead reliability."], ["Animals", "Cats", "If you can arrange a calm cat safely (Hugo on lead), reward calm and zero chasing. Builds restraint around cats and small fast animals — useful around the village and visiting homes with cats."], ["Animals", "Horses & livestock", "Walk past horses, sheep or cows behind fencing on a short lead; reward calm. The law and good sense demand a steady dog around livestock. Essential for Chiltern and countryside walks."], ["Animals", "Ducks & birds", "At the river, reward Hugo for watching ducks, geese and birds without lunging or chasing. Builds calm around the wildlife he'll see on every Thames-side walk."], ["Animals", "Squirrels & wildlife", "The big one for Labs. On the long line, the moment he spots a squirrel, call him and reward the turn-back BEFORE he locks on. Catch it early, reward heavily. Manages the chase instinct on woodland walks."], ["Animals", "Pass a dog, keep walking", "The everyday goal: walk straight past another dog on lead without stopping, Hugo's attention flicking to you for a reward. No greeting needed. This is what a calm, easy walking companion looks like."], ["Environments", "Mixed surfaces", "In one outing, walk over grass, gravel and tarmac so varied ground feels normal. Reward confident steps. Pups can be funny about new textures — exposure now prevents balking later."], ["Environments", "Metal grates & drains", "Many dogs distrust metal grids and drain covers (they can see through them). Never drag him — lure with treats, reward each paw, let him choose to cross. Builds confidence on urban pavements."], ["Environments", "Shiny / slippery floors", "Polished shop and vet floors feel weird and slippery. Practise at a pet-shop or vet entrance, rewarding confident steps. Prevents the freeze-at-the-door we often see in pups indoors."], ["Environments", "Wobble board / unstable surface", "Reward him for putting paws on, then standing on, something that gives slightly (a cushion, low wobble board). Builds body awareness and confidence so uneven ground and bridges don't faze him."], ["Environments", "Stairs", "On lead, walk calmly up and down a flight, rewarding steady steps rather than a mad dash. Take it slow with a growing pup to protect joints. Builds confidence for homes, shops and stations with stairs."], ["Environments", "Automatic doors", "Sliding doors that move on their own surprise dogs. Approach, reward calm, walk through together as they open. Useful for vets, shops and stations."], ["Environments", "Lift", "If you can access one safely, do a short lift ride; reward calm. A small moving box tests composure. Skip if not relevant, but handy for trips into town or buildings."], ["Environments", "Narrow gaps & crowds", "Walk through a narrow doorway, gate or small cluster of people so tight spaces don't fluster him. Use 'middle' or hand-target to guide him. Builds confidence for busy high streets and events."], ["Environments", "Busy cafe / pub — the 'Early Bar' test", "The big social goal. Build up to settling under a table in a busy cafe or pub. Bring his mat and a long-lasting chew, pick a quiet corner, reward calm. Start with quieter venues and short visits. Eventually he's the dog that sleeps through a busy pub."], ["Environments", "Car park", "Cars, trolleys and people moving around in an open space. Walk through calmly on a short lead, rewarding focus on you. Mind moving vehicles. Good real-world proofing with managed risk."], ["Environments", "Cookham High Street", "A full calm walk through the High Street — shoppers, shop doors, traffic, smells. Reward loose lead and check-ins. Local proofing that pulls together people, surfaces and noise close to home."], ["Environments", "River & Cookham Moor", "Practise calm around the open space, dogs, walkers, ducks and picnics at the Moor and riverside. A core local environment — you want him relaxed and responsive here."], ["Environments", "Garden centre / pet shop", "Take him somewhere dog-friendly and busy indoors. Loose-lead exploring, rewarding calm, lots of new sights and smells in a controlled space. Great all-round confidence builder."], ["Environments", "Settle outside a shop (supervised)", "With someone ALWAYS holding him (never tied and left alone — theft and stress risk), practise a calm down-stay outside a shop while the other person briefly steps in. Builds patience and calm waiting in public."], ["Environments", "Public transport", "If you'll use it, a short, calm bus or train trip. Reward settling on the floor by your feet, away from the aisle. Go off-peak first. Prepares him for wider travel and days out."], ["Sounds", "Vacuum cleaner", "Start with the vacuum off and present, treating. Then on at a distance, treat for calm, gradually closer over sessions. Never chase him with it. Turns a classic puppy nemesis into a non-event."], ["Sounds", "Washing machine / dishwasher", "Let him hear these humming and clunking while he relaxes nearby, rewarding calm. Everyday household sounds he should completely ignore — easy early win for noise confidence."], ["Sounds", "Doorbell", "Ring it (or play a recording) at low volume and reward calm instead of a barking charge at the door. Pair the bell with 'go to your place' and a treat. Tackles one of the most common barking triggers."], ["Sounds", "Thunder / rain (low volume)", "Play a thunderstorm recording very quietly while he eats or chews something nice. Keep it low enough that he stays relaxed, raise volume over weeks. Building calm now prevents storm phobia later."], ["Sounds", "Fireworks (low volume)", "Same desensitising method with a fireworks soundtrack, very quiet, paired with treats/dinner, volume up gradually over time. Do this well before bonfire season. One of the most valuable things you can prepare him for."], ["Sounds", "Traffic noise", "Sit a little way back from a busy road and reward calm watching and listening. Build closer as he copes. Prepares him for walking confidently through town and beside main roads."], ["Sounds", "Sirens", "Emergency sirens (real or recorded) can set off howling or panic. Reward calm whenever you hear one. Keep it low-key and positive so sirens become meaningless background noise."], ["Sounds", "Sudden dropped-object bang", "Deliberately drop something that clatters at a distance, then act totally normal and reward him for recovering quickly. You're building 'bounce-back' — the hallmark of a resilient, unflappable dog."], ["Sounds", "Kitchen noises", "Blenders, clattering pans, the extractor fan — let him hear them while rewarding a settle just outside the kitchen. Stops kitchen anxiety and underfoot pestering at mealtimes."], ["Sounds", "Garden power tools", "Mower, strimmer, hedge trimmer, drill — start at a distance and reward calm, closing in over sessions. Relevant with your garden work; you want him relaxed when the tools come out."], ["Resilience", "Alone — 10 min in a room", "Settle him behind a baby gate or closed door for 10 minutes with a chew. Leave and return calmly — no big fuss either way. Build gradually. Teaches that being apart from you is normal and safe. Use a camera if unsure."], ["Resilience", "Alone — 30 min in the house", "Leave the house entirely for ~30 minutes. Keep departures and arrivals low-key and boring. Watch on a camera if you can. Build only as he stays settled — rushing this is the main cause of separation problems."], ["Resilience", "Alone — 1–2 hours", "Once 30 minutes is genuinely relaxed, extend to a couple of hours. Leave a safe chew and his settle bed. Never rush the jump in duration. The goal is a dog who simply sleeps while you're out."], ["Resilience", "Tied briefly (supervised)", "With you watching from a few steps away, clip him to a fixed point for a minute, reward calm waiting, return. Builds patience and tolerance of brief restraint — but only ever supervised, never left alone in public."], ["Resilience", "Startle recovery", "When something surprises him, note how fast he shakes it off — a resilient dog recovers in seconds. Stay relaxed yourself (your calm travels down the lead), reward the bounce-back. You're building emotional resilience, the core of an unflappable dog."], ["Resilience", "Happy vet visits", "Pop into the vet just to weigh him, get a treat from the staff, and leave — no procedure. Repeat. The vet becomes a good place, not a scary one, which pays off for life at every check-up."], ["Resilience", "Vet handling / mock exam", "Practise a pretend examination: you or a helper gently restrain while the other checks ears, paws, mouth and runs hands down the body, treating throughout. Makes real exams and jabs calm and stress-free."], ["Resilience", "Full-body grooming", "Brush him all over calmly, little and often, rewarding stillness. Include sensitive areas — belly, tail, legs. With a Lab's coat and muddy Chiltern walks, easy grooming is a must, not a nice-to-have."], ["Resilience", "Nails / dremel", "Introduce nail clippers or a dremel in tiny steps: let him sniff the tool, treat; touch a nail with it, treat; do ONE nail, treat, stop. Build up over many short sessions. Calm nail care saves a lifetime of stress."], ["Resilience", "Settles in new places", "Take him somewhere new and simply reward how quickly he settles and relaxes. The speed he 'switches off' in novel places is the real measure of an adaptable, bombproof dog. Practise often, everywhere."], ["Proofing", "Down-stay while a dog passes", "Hold a down-stay while another dog walks past at a distance. Reward heavily for holding position despite the temptation. Increase difficulty by decreasing distance. Combines impulse control + dog neutrality — a real test."], ["Proofing", "Hold position, food dropped", "Put him in a stay, then drop food nearby. Reward ONLY if he holds; cover the food if he breaks. Builds serious self-control — the kind that stops him hoovering dropped food on walks or at the table."], ["Proofing", "Recall past a person with food", "Have a helper hold out food. Call Hugo to YOU past them; reward massively for choosing you over the food. Proofs recall against one of the strongest distractions there is for a Lab."], ["Proofing", "Ignore pavement food ('leave')", "On a real walk, cue 'leave' for dropped food/rubbish on the ground and keep moving, rewarding from your hand. A genuine safety skill — pavements and parks are full of things that could harm him."], ["Proofing", "Steady when a ball is thrown", "Have someone throw a ball for another dog while Hugo holds position. Reward staying steady. A huge test of self-control for a retriever — nail this and his impulse control is excellent."], ["Proofing", "Focused in a new busy place", "Take everything you've taught to a brand-new busy environment and reward calm focus and responsiveness amid the chaos. Proofing means it works ANYWHERE, not just where he learned it."], ["Proofing", "Full-distraction town walk", "A whole walk on a loose lead through town with people, dogs, traffic, food smells and noise — putting the entire programme together in one outing. Reward generously. This is the near-finished article."], ["Proofing", "An unflappable day out", "The graduation test: a full day out from start to finish — travel, a busy cafe, crowds, other dogs, new places — calm and steady throughout. When he can do this relaxed, you've built the calm, bombproof, fully-socialised dog you set out to."]];

  }

    var ev=document.getElementById("new-end")?.value;

    if(ev)S.nev.endDate=ev;
    var old=document.querySelector(".modal-bg");if(old)old.remove();
    showAddModal();
    return;
  }
  if(a==="edit-tod"){
    var tod2=el.dataset.tod;
    var tv2=document.getElementById("edit-t")?.value;
    var dv2=document.getElementById("edit-d")?.value;
    var ev2=document.getElementById("edit-end")?.value;
    S.edit=Object.assign({},S.edit,{tod:tod2});
    if(tv2!==undefined)S.edit.title=tv2;
    if(dv2)S.edit.date=dv2;
    if(ev2)S.edit.endDate=ev2;
    var old2=document.querySelector(".modal-bg");if(old2)old2.remove();
    showModal();
    return;
  }
  if(a==="add-toggle"){
    var m=el.dataset.m;
    var cur=Array.isArray(S.nev.member)?S.nev.member:[];
    var next=cur.indexOf(m)>-1?cur.filter(function(x){return x!==m;}):[...cur,m];
    // Preserve typed values
    var tv=document.getElementById("new-t")?.value;
    var dv=document.getElementById("new-d")?.value;
    var ev=document.getElementById("new-end")?.value;
    var newNev=Object.assign({},S.nev,{member:next});
    if(tv)newNev.title=tv;
    if(dv)newNev.date=dv;
    if(ev)newNev.endDate=ev;
    S.nev=newNev;
    var old=document.querySelector(".modal-bg");if(old)old.remove();
    showAddModal();
  }
  if(a==="delete-event"){
    var id=el.dataset.id;
    evDelete(id);
    var newEvs=S.events.filter(function(e){return e.id!==id;});
    set({events:newEvs,showEdit:false,editId:null});
    var m=document.querySelector(".modal-bg");if(m)m.remove();

  // Shop

  if(a==="todo-clr"){_tClr();}

  if(a==="watch-add-movie"||a==="watch-add-tv"){
    var wv=document.getElementById("wi");
    if(wv&&wv.value.trim()){_wAdd(wv.value.trim(),a==="watch-add-movie"?"movie":"tv");wv.value="";}

<script>
var STV={
  C:"252665",S:"baa6b378bb17f228dfb918528d8eb68f01065a49",
  R:"https://rascals70.github.io/rascals/rascals.html",
  TARGET_KM:80,
  data:null,
  loading:false,
  ok:function(){
    var r=localStorage.getItem("stv_r");
    return !!(r&&r.length>0);
  },
  connect:function(){
    location.href="https://www.strava.com/oauth/authorize?client_id="+STV.C
      +"&response_type=code&redirect_uri="+encodeURIComponent(STV.R)
      +"&approval_prompt=force&scope=read,activity:read_all";
  },
  exchange:function(code){
    return fetch("https://www.strava.com/oauth/token",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({client_id:STV.C,client_secret:STV.S,code:code,grant_type:"authorization_code"})
    }).then(function(r){return r.json();}).then(function(d){
      if(d.refresh_token){
        localStorage.setItem("stv_r",d.refresh_token);
        localStorage.setItem("stv_a",d.access_token);
        localStorage.setItem("stv_e",String(d.expires_at));
      }
      return d.access_token||null;
    });
  },
  tok:function(){
    var exp=parseInt(localStorage.getItem("stv_e")||"0");
    var ref=localStorage.getItem("stv_r");
    if(!ref)return Promise.resolve(null);
    if(Date.now()/1000<exp-300)return Promise.resolve(localStorage.getItem("stv_a"));
    return fetch("https://www.strava.com/oauth/token",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({client_id:STV.C,client_secret:STV.S,refresh_token:ref,grant_type:"refresh_token"})
    }).then(function(r){return r.json();}).then(function(d){
      if(d.access_token){
        localStorage.setItem("stv_a",d.access_token);
        localStorage.setItem("stv_e",String(d.expires_at));
        localStorage.setItem("stv_r",d.refresh_token||ref);
      }
      return d.access_token||null;
    });
  },
  load:function(){
    if(STV.loading)return;
    STV.loading=true;
    STV.tok().then(function(t){
      if(!t){STV.loading=false;return;}
      var after=Math.floor((Date.now()-366*86400000)/1000);
      Promise.all([
        fetch("https://www.strava.com/api/v3/athlete/activities?per_page=200&after="+after+"&page=1",{headers:{Authorization:"Bearer "+t}}).then(function(r){return r.json();}),
        fetch("https://www.strava.com/api/v3/athlete/activities?per_page=200&after="+after+"&page=2",{headers:{Authorization:"Bearer "+t}}).then(function(r){return r.json();}),
        fetch("https://www.strava.com/api/v3/athlete/activities?per_page=200&after="+after+"&page=3",{headers:{Authorization:"Bearer "+t}}).then(function(r){return r.json();})
      ]).then(function(pages){
        var all=[];
        pages.forEach(function(p){if(Array.isArray(p))all=all.concat(p);});
        var runs=all.filter(function(a){return a.type==="Run"||a.sport_type==="Run";});
        runs.sort(function(a,b){return(b.start_date_local||"").localeCompare(a.start_date_local||"");});
        var now=new Date();now.setHours(0,0,0,0);
        var dow=(now.getDay()+6)%7;
        var mon=new Date(now);mon.setDate(now.getDate()-dow);
        var weeks=[];
        for(var i=51;i>=0;i--){
          var ws=new Date(mon);ws.setDate(mon.getDate()-i*7);
          var we=new Date(ws);we.setDate(ws.getDate()+6);we.setHours(23,59,59);
          var km=runs.filter(function(r){
            var d=new Date(r.start_date_local);return d>=ws&&d<=we;
          }).reduce(function(s,r){return s+r.distance/1000;},0);
          weeks.push({ws:new Date(ws),km:parseFloat(km.toFixed(1))});
        }
        var total=(runs.reduce(function(s,r){return s+r.distance;},0)/1000).toFixed(0);
        var maxKm=Math.max.apply(null,weeks.map(function(w){return w.km;}).concat([STV.TARGET_KM+10]));
        STV.data={weeks:weeks,total:total,maxKm:maxKm,count:runs.length,lr:runs[0]||null};
        STV.loading=false;
        if(typeof render==="function")render();
      }).catch(function(e){
        console.error("STV fetch error",e);
        STV.loading=false;
      });
    }).catch(function(e){
      console.error("STV tok error",e);
      STV.loading=false;
    });
  },
  km:function(m){return(m/1000).toFixed(1);},
  pace:function(s,m){var p=s/m*1000;var mn=Math.floor(p/60);var sc=Math.round(p%60);return mn+":"+(sc<10?"0":"")+sc;},
  chart:function(){
    if(!STV.ok()){
      return'<a href="'+STV.R.replace('rascals.html','')+'rascals.html" onclick="STV.connect();return false;" style="display:flex;width:100%;background:linear-gradient(135deg,#fc4c02,#e34402);border:none;border-radius:14px;padding:14px 18px;align-items:center;gap:12px;text-decoration:none;box-sizing:border-box">'
        +'<span style="font-size:22px">&#127939;</span>'
        +'<div style="text-align:left"><div style="font-size:14px;font-weight:700;color:#fff">Connect Strava</div>'
        +'<div style="font-size:11px;color:rgba(255,255,255,.75);margin-top:2px">Tap to authorise</div></div></a>';
    }
    if(!STV.data){
      if(!STV.loading)STV.load();
      return'<div style="border:1px solid rgba(252,76,2,.2);border-radius:14px;padding:20px;text-align:center;color:#888;font-size:13px">&#127939; Loading Strava data...</div>';
    }
    var d=STV.data;
    var YPAD=24,XPAD=28,RPAD=8,TPAD=16,BPAD=20,W=320,H=130;
    var cw=W-XPAD-RPAD,ch=H-TPAD-BPAD;
    var max=d.maxKm,ws=d.weeks,n=ws.length,bw=cw/n;
    var pts=ws.map(function(w,i){return{x:XPAD+i*bw+bw/2,y:TPAD+ch-(w.km/max)*ch,km:w.km};});
    var area="M"+(XPAD)+","+(TPAD+ch);pts.forEach(function(p){area+=" L"+p.x.toFixed(1)+","+p.y.toFixed(1);});area+=" L"+(XPAD+cw)+","+(TPAD+ch)+" Z";
    var line="M"+pts[0].x.toFixed(1)+","+pts[0].y.toFixed(1);pts.slice(1).forEach(function(p){line+=" L"+p.x.toFixed(1)+","+p.y.toFixed(1);});
    var months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var labels="",lastM=-1;
    pts.forEach(function(p,i){var m=ws[i].ws.getMonth();if(m!==lastM){labels+='<text x="'+p.x.toFixed(1)+'" y="'+(TPAD+ch+BPAD-2)+'" fill="#555" font-size="8" text-anchor="middle">'+months[m]+'</text>';lastM=m;}});
    var yAxis="";
    [0,40,80,Math.round(max)].forEach(function(v){if(v>max)return;var y=TPAD+ch-(v/max)*ch;yAxis+='<line x1="'+XPAD+'" y1="'+y.toFixed(1)+'" x2="'+(XPAD+cw)+'" y2="'+y.toFixed(1)+'" stroke="rgba(255,255,255,.06)" stroke-width="1"/><text x="'+(XPAD-3)+'" y="'+(y+3).toFixed(1)+'" fill="#555" font-size="7" text-anchor="end">'+v+'</text>';});
    var targetY=TPAD+ch-(STV.TARGET_KM/max)*ch;
    var targetLine='<line x1="'+XPAD+'" y1="'+targetY.toFixed(1)+'" x2="'+(XPAD+cw)+'" y2="'+targetY.toFixed(1)+'" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/><text x="'+(XPAD+cw+2)+'" y="'+(targetY+3).toFixed(1)+'" fill="#22c55e" font-size="7">80</text>';
    var race=new Date("2026-09-09");var dLeft=Math.ceil((race-new Date())/86400000);
    var BOX="background:linear-gradient(135deg,rgba(252,76,2,.14),rgba(252,76,2,.04));border:1px solid rgba(252,76,2,.25);border-radius:16px;padding:14px 16px";
    return'<div style="'+BOX+'">'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">'
      +'<div><div style="font-size:22px;font-weight:800;color:#fff;font-family:Syne,sans-serif;line-height:1">'+d.total+'<span style="font-size:12px;color:#fc4c02;margin-left:3px">km</span></div>'
      +'<div style="font-size:10px;color:#666;margin-top:2px">12 months &middot; '+d.count+' runs</div></div>'
      +'<div style="text-align:right"><div style="font-size:15px;font-weight:800;color:#22c55e;line-height:1">'+dLeft+'d</div>'
      +'<div style="font-size:9px;color:#666;text-transform:uppercase;letter-spacing:1px;margin-top:1px">to race</div></div></div>'
      +'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block;overflow:visible">'
      +'<defs><linearGradient id="og" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fc4c02" stop-opacity="0.45"/><stop offset="100%" stop-color="#fc4c02" stop-opacity="0.02"/></linearGradient></defs>'
      +yAxis+targetLine+'<path d="'+area+'" fill="url(#og)"/><path d="'+line+'" fill="none" stroke="#fc4c02" stroke-width="1.8" stroke-linejoin="round"/>'+labels
      +'</svg>'
      +'<div style="font-size:9px;color:#444;margin-top:4px;display:flex;align-items:center;gap:6px">'
      +'<span style="display:inline-block;width:16px;height:1px;background:#22c55e;border-top:1px dashed #22c55e"></span>'
      +'<span>80km weekly target</span>'
      +'<span style="margin-left:8px;color:#333">&middot; Live from Strava</span></div>'
      +'</div>';
  }
};
</script>
<script>
(function(){
  try{
    var p=new URLSearchParams(window.location.search);
    var code=p.get("code");
    if(code){
      window.history.replaceState({},"",window.location.pathname);
      STV.exchange(code).then(function(){STV.load();});
    }else if(STV.ok()){
      STV.load();
    }
  }catch(e){console.error("STV init error",e);}
})();
</script>
